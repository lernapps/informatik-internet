# yaml-language-server: $schema=../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
format: 2
strand: informatik/informatiksysteme
title:
  de: Wie das Internet funktioniert
  en: How the internet works
intro:
  de: >-
    Die Klasse 7b plant einen Projekttag: „Wir spielen das Internet“. Im Klassenchat fragt Ben: „Wie kommt die Seite
    von unserem Ausflug eigentlich auf mein Handy?“ Mit Jona, Selin, Mia und den anderen findest du es heraus. Im
    Netz-Simulator schickst du Päckchen von Rechner zu Rechner: über Router, mit Adressen, mit einem Telefonbuch für
    Namen, bis eine ganze Webseite bei dir ankommt.
  en: >-
    Class 7b is planning a project day: “We play the internet”. In the class chat Ben asks: “How does the page about
    our school trip actually get onto my phone?” You find out with Jona, Selin, Mia and the others. In the network
    simulator you send packets from computer to computer: through routers, with addresses, with a phone book for
    names, until a whole web page reaches you.
languages: [de, en]
tasks: { start: first }
chapters: [netz]
sources:
