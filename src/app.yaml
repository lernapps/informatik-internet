      en: "German Informatics Society: Educational standards in computer science, lower secondary (2025), section 5.4, IS-5"
    url: "https://www.mnu.de/images/fachbereiche/Informatik/Bildungsstandards_Sek_I_2025__pdf-A_.pdf"
  - title:
      de: "ISB Bayern: LehrplanPLUS Gymnasium, Natur und Technik 7, Lernbereich 2.1 Vernetzte Informationsstrukturen"
      en: "ISB Bavaria: LehrplanPLUS Gymnasium, science and technology 7, unit 2.1 networked information structures"
    url: "https://www.lehrplanplus.bayern.de/fachlehrplan/gymnasium/7/nt_gym"
