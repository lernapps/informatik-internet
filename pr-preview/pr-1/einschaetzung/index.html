<li class="explainer-assessment-item" data-key="a15"><p class="explainer-assessment-label">Aufgabe 15</p><div class="question" id="frage-a15" data-id="a15" data-type="matching">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Welches Protokoll gehört zu welcher Aufgabe?</legend>
<p class="question-hint">Wähle zu jedem Eintrag das Passende.</p>
<ul class="question-pairs">
<li><label><span>eine Webseite verschlüsselt abrufen</span> <select name="frage-a15-0" data-left="0"><option value="">bitte wählen</option><option value="1">SMTP</option><option value="2">IMAP</option><option value="3">Dateipfad</option><option value="0">HTTPS</option></select></label></li>
<li><label><span>eine E-Mail verschicken</span> <select name="frage-a15-1" data-left="1"><option value="">bitte wählen</option><option value="1">SMTP</option><option value="2">IMAP</option><option value="3">Dateipfad</option><option value="0">HTTPS</option></select></label></li>
<li><label><span>neue E-Mails vom Server abholen</span> <select name="frage-a15-2" data-left="2"><option value="">bitte wählen</option><option value="1">SMTP</option><option value="2">IMAP</option><option value="3">Dateipfad</option><option value="0">HTTPS</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> eine Webseite verschlüsselt abrufen – HTTPS; eine E-Mail verschicken – SMTP; neue E-Mails vom Server abholen – IMAP</p>
<p class="question-explanation">HTTPS holt Webseiten verschlüsselt, SMTP verschickt E-Mails, IMAP holt sie ab. Ein Dateipfad ist kein Protokoll, sondern der Ort einer Datei.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
</div></li>

<li class="explainer-assessment-item" data-key="a16"><p class="explainer-assessment-label">Aufgabe 16</p><div class="question" id="frage-a16" data-id="a16" data-type="ordering">
<form class="question-form" novalidate>
<fieldset>
<legend class="question-text">Bring die sechs Schritte beim Abruf einer Webseite in die richtige Reihenfolge.</legend>
<p class="question-hint">Gib jedem Eintrag seinen Platz: 1 für den ersten.</p>
<ul class="question-pairs">
<li><label><span>Der Webserver schickt eine Kopie als Antwort.</span> <select name="frage-a16-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Browser zeigt die Seite.</span> <select name="frage-a16-5" data-item="5"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Browser schickt die Anfrage an diese Adresse.</span> <select name="frage-a16-2" data-item="2"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Browser liest die URL.</span> <select name="frage-a16-0" data-item="0"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Browser fragt das DNS nach der IP-Adresse.</span> <select name="frage-a16-1" data-item="1"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Webserver sucht die Datei zum Pfad.</span> <select name="frage-a16-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
<div class="question-reveal" hidden>
<p><strong>Richtige Antwort:</strong> 1. Der Browser liest die URL., 2. Der Browser fragt das DNS nach der IP-Adresse., 3. Der Browser schickt die Anfrage an diese Adresse., 4. Der Webserver sucht die Datei zum Pfad., 5. Der Webserver schickt eine Kopie als Antwort., 6. Der Browser zeigt die Seite.</p>
<p class="question-explanation">Erst Name in Zahl übersetzen, dann fragen, dann antworten. Router reichen dabei jedes Päckchen weiter.</p>
</div>
<p class="question-actions" hidden><button type="submit" class="question-check">Prüfen</button></p>
</form>
