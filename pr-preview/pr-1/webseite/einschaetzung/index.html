<li><label><span>Der Browser zeigt die Seite.</span> <select name="frage-a7-5" data-item="5"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Webserver sucht die Datei zum Pfad.</span> <select name="frage-a7-3" data-item="3"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
<li><label><span>Der Webserver schickt eine Kopie als Antwort.</span> <select name="frage-a7-4" data-item="4"><option value="">bitte wählen</option><option value="0">Platz 1</option><option value="1">Platz 2</option><option value="2">Platz 3</option><option value="3">Platz 4</option><option value="4">Platz 5</option><option value="5">Platz 6</option></select></label></li>
</ul>
</fieldset>
