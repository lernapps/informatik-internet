<li><label><span>The browser reads the URL.</span> <select name="frage-a7-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>

<li><label><span>The browser shows the page.</span> <select name="frage-a7-5" data-item="5"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The web server looks for the file for the path.</span> <select name="frage-a7-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The web server sends a copy as its response.</span> <select name="frage-a7-4" data-item="4"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
</ul>
</fieldset>

<p><strong>Right answer:</strong> 1. The browser reads the URL., 2. The browser asks DNS for the IP address., 3. The browser sends the request to this address., 4. The web server looks for the file for the path., 5. The web server sends a copy as its response., 6. The browser shows the page.</p>
<p class="question-explanation">First translate the name into a number, then ask, then answer. Routers pass every packet on along the way.</p>
