<fieldset>
<legend class="question-text">Which protocol goes with which job?</legend>
<p class="question-hint">Choose the match for each entry.</p>

<li><label><span>load a web page encrypted</span> <select name="frage-a15-0" data-left="0"><option value="">please choose</option><option value="1">SMTP</option><option value="2">IMAP</option><option value="3">file path</option><option value="0">HTTPS</option></select></label></li>

</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>

<li><label><span>The browser shows the page.</span> <select name="frage-a16-5" data-item="5"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The browser sends the request to this address.</span> <select name="frage-a16-2" data-item="2"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The browser reads the URL.</span> <select name="frage-a16-0" data-item="0"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The browser asks DNS for the IP address.</span> <select name="frage-a16-1" data-item="1"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
<li><label><span>The web server looks for the file for the path.</span> <select name="frage-a16-3" data-item="3"><option value="">please choose</option><option value="0">Place 1</option><option value="1">Place 2</option><option value="2">Place 3</option><option value="3">Place 4</option><option value="4">Place 5</option><option value="5">Place 6</option></select></label></li>
</ul>
</fieldset>
<div class="question-feedback-row"><div class="question-feedback" role="status"></div></div>
